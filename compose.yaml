services:
  analyzer:
    build:
      context: .
      dockerfile: crates/analyzer/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-eth0}
      DATA_DIR: /data
      FLAG_REGEX: ${FLAG_REGEX:-FLAG_[A-Za-z0-9]+}
      SEGMENT_DURATION: ${SEGMENT_DURATION:-30m}
      SEGMENT_RETENTION_COUNT: ${SEGMENT_RETENTION_COUNT:-3}
      FLOW_IDLE_TIMEOUT: ${FLOW_IDLE_TIMEOUT:-30s}
      MAX_STREAM_BYTES: ${MAX_STREAM_BYTES:-4MiB}
      RUST_LOG: ${RUST_LOG:-newhatch=info}
      LISTEN_ADDR: 127.0.0.1:3000
      USERNAME: ${USERNAME:-}
      PASSWORD: ${PASSWORD:-}
      SESSION_EXPIRACY: ${SESSION_EXPIRACY:-86400s}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ANALYZER: ${ANALYZER:-local}
      LISTEN_CONNSTR: ${LISTEN_CONNSTR:-0.0.0.0:39090}
      ALLOWED_COLLECTORS: ${ALLOWED_COLLECTORS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  collector:
    profiles:
      - collector
    build:
      context: .
      dockerfile: crates/collector/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-eth0}
      COLLECTOR_ID: ${COLLECTOR_ID:-vulnbox-1}
      ANALYZER_CONNSTR: ${ANALYZER_CONNSTR:-127.0.0.1:39090}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-8192}
      RUST_LOG: ${RUST_LOG:-newhatch=info}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: host
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      AUTH_ALLOWED_SUBNETS: ${AUTH_ALLOWED_SUBNETS:-}
    depends_on:
      - analyzer
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:7.0
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command:
      - -i
      - ${CAPTURE_INTERFACE:-eth0}
      - ${SURICATA_BPF_FILTER:-tcp and (port 8080)}
    volumes:
      - ./data/suricata:/var/log/suricata
    restart: unless-stopped

  test-flag:
    image: nginx:1.27-alpine
    profiles:
      - test
    ports:
      - "18080:18080"
    volumes:
      - ./test/flag_test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/flag_test/html:/usr/share/nginx/html:ro
    restart: unless-stopped
