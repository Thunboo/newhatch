[package]
name = "newhatchctl"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local keyboard-only control panel for newhatch"

# Keep the control tool independent of the capture workspace and Docker builds.
[workspace]
resolver = "2"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
strip-ansi-escapes = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.15"
