<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e27" />
    <meta
      name="description"
      content="SWS - Space Web System для управления космическими базами и ресурсами"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <title>SWS - Space Web System</title>
    <style>
      /* Начальная загрузка с космической анимацией */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #000000 0%, #0a0e27 50%, #000814 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-rocket {
        width: 80px;
        height: 80px;
        margin-bottom: 30px;
        animation: rocketFloat 2s ease-in-out infinite;
      }
      
      @keyframes rocketFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      
      .loading-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(90deg, #00d9ff 0%, #b366ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 20px;
        animation: textPulse 2s ease-in-out infinite;
      }
      
      @keyframes textPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 217, 255, 0.1);
        border-top: 4px solid #00d9ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>Вам необходимо включить JavaScript для работы этого приложения.</noscript>
    
    <!-- Экран загрузки -->
    <div id="loading-screen">
      <svg class="loading-rocket" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L60 40 L70 50 L60 60 L50 90 L40 60 L30 50 L40 40 Z" 
              fill="url(#rocketGradient)" stroke="#00d9ff" stroke-width="2"/>
        <circle cx="50" cy="35" r="8" fill="#b366ff" opacity="0.8"/>
        <defs>
          <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b366ff;stop-opacity:1" />
          </linearGradient>
        </defs>
      </svg>
      <div class="loading-text">SWS - Space Web System</div>
      <div class="loading-spinner"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Скрыть экран загрузки после загрузки приложения
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
