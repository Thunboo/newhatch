{% extends "base.html" %}

{% block title %}Редактирование новости - DNK Space News{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Редактирование новости</h1>
    
    <form method="POST" action="{{ url_for('news.edit_news', news_id=news.id) }}" class="content-form">
        <div class="form-group">
            <label for="title">Заголовок новости *</label>
            <input type="text" id="title" name="title" value="{{ news.title }}" required maxlength="200">
        </div>
        
        <div class="form-group">
            <label for="category">Категория *</label>
            <select id="category" name="category" required>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == news.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="content">Содержание новости *</label>
            <textarea id="content" name="content" rows="15" required>{{ news.content }}</textarea>
        </div>
        
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="is_private" {% if news.is_private %}checked{% endif %}>
                Приватная новость (видна только вам)
            </label>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a href="{{ url_for('news.news_detail', news_id=news.id) }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
