version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dws_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dws_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dws-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dws-network

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:dws_password@postgres:5432/dws_db
      JWT_SECRET: your_secret_key_change_in_production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dws-documents
      NODE_ENV: production
      PORT: 5001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dws-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    environment:
      REACT_APP_API_URL: http://192.168.1.187:5000/api
    depends_on:
      - backend
    networks:
      - dws-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  dws-network:
    driver: bridge
