[workspace]
members = ["crates/analyzer", "crates/collector", "crates/protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
crc32fast = "1.4"
httparse = "1.9"
libc = "0.2"
prost = "0.13"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
time = "=0.3.44"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
