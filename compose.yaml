services:
  analyzer:
    build:
      context: .
      dockerfile: crates/analyzer/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-eth0}
      DATA_DIR: /data
      FLAG_REGEX: ${FLAG_REGEX:-FLAG_[A-Za-z0-9]+}
      SEGMENT_DURATION: ${SEGMENT_DURATION:-30m}
      SEGMENT_RETENTION_COUNT: ${SEGMENT_RETENTION_COUNT:-3}
      FLOW_IDLE_TIMEOUT: ${FLOW_IDLE_TIMEOUT:-30s}
      MAX_STREAM_BYTES: ${MAX_STREAM_BYTES:-4MiB}
      RUST_LOG: ${RUST_LOG:-newhatch=info}
      LISTEN_ADDR: 127.0.0.1:3000
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PACKET_INGRESS_MODE: ${PACKET_INGRESS_MODE:-local}
      COLLECTOR_LISTEN_ADDR: ${COLLECTOR_LISTEN_ADDR:-0.0.0.0:39090}
      COLLECTOR_ALLOWED_IPS: ${COLLECTOR_ALLOWED_IPS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  collector:
    profiles:
      - collector
    build:
      context: .
      dockerfile: crates/collector/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-eth0}
      COLLECTOR_ID: ${COLLECTOR_ID:-vulnbox-1}
      RECEIVER_ADDR: ${RECEIVER_ADDR:-127.0.0.1}
      RECEIVER_PORT: ${RECEIVER_PORT:-39090}
      COLLECTOR_QUEUE_CAPACITY: ${COLLECTOR_QUEUE_CAPACITY:-8192}
      RUST_LOG: ${RUST_LOG:-newhatch=info}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: host
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      AUTH_ALLOWED_SUBNETS: ${AUTH_ALLOWED_SUBNETS:-}
    volumes:
      - ./logo.png:/usr/share/nginx/html/logo.png:ro
    depends_on:
      - analyzer
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:7.0
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command:
      - -i
      - ${CAPTURE_INTERFACE:-eth0}
      - ${SURICATA_BPF_FILTER:-tcp and (port 8080)}
    volumes:
      - ./data/suricata:/var/log/suricata
    restart: unless-stopped

  test-flag:
    image: nginx:1.27-alpine
    profiles:
      - test
    ports:
      - "18080:18080"
    volumes:
      - ./test/flag_test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/flag_test/html:/usr/share/nginx/html:ro
    restart: unless-stopped
